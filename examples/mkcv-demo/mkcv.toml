# mkcv workspace configuration
# Docs: https://github.com/bkuberek/mkcv
#
# All settings are optional: sensible defaults are built in.
# Uncomment sections below to customise. Values shown are the defaults.
#
# Any option below can also go in the user file ~/.config/mkcv/settings.toml,
# which applies to every workspace. This file overrides it.
#
# Layers, later ones override earlier ones:
#   built-in defaults < ~/.config/mkcv/settings.toml < this file < environment variables < command-line flags
#
# All section headers use the [default.] prefix because mkcv uses
# Dynaconf environments. This prefix is required for settings to
# take effect.

[default.workspace]
version = "1.1.0"

[default.paths]
knowledge_base_dir = "knowledge-base"
applications_dir = "applications"
templates_dir = "templates"

[default.naming]
company_slug = true
application_pattern = "{company}/{position}/{date}"

[default.defaults]
theme = "sb2nov"
profile = "standard"

# ── Rendering ─────────────────────────────────────────────────────
# Theme controls the visual design of your resume PDF. Run
# `mkcv themes` to list themes, `mkcv themes --preview <name>`
# to preview one.
#
# [default.rendering]
# theme = "sb2nov"           # classic, engineeringresumes, moderncv, ...
# font = "SourceSansPro"     # any system font
# font_size = "10pt"
# page_size = "letterpaper"  # letterpaper or a4paper
#
# [default.rendering.overrides]
# primary_color = "003366"   # hex colour without #
#
# Page margins: override RenderCV theme defaults
# [default.rendering.page]
# top_margin = "0.7in"
# bottom_margin = "0.7in"
# left_margin = "0.5in"
# right_margin = "0.5in"
#
# Header spacing below name/headline/connections
# [default.rendering.header]
# space_below_name = "0.15cm"
# space_below_headline = "0.15cm"
# space_below_connections = "0.3cm"
#
# Experience section geometry
# [default.rendering.entries]
# date_and_location_width = "3.6cm"
#
# Section heading style
# [default.rendering.section_titles]
# type = "with_full_line"
# space_above = "0.3cm"
# space_below = "0.15cm"
#
# Line spacing and text alignment
# [default.rendering.typography]
# line_spacing = "0.7em"
# alignment = "justified"

# ── Pipeline ──────────────────────────────────────────────────────
# Which models run each stage comes from a model profile. The default is the
# "anthropic" profile. Recommended Claude mix: Haiku for extraction, Opus
# for decisions and writing, Sonnet for YAML. Run `mkcv models` to see what
# every stage will use, and `mkcv models --profiles` to list the profiles.
# All profiles are provisional: they are not yet backed by an eval run.
#
# Profiles: anthropic, anthropic-economy, openai, openai-economy, google,
# google-economy, local.
# Resume density is not a config key: pass --preset (concise, standard,
# comprehensive) on the command line.
#
# [default.pipeline]
# model_profile = "anthropic"
# provider = "anthropic"  # used when model_profile is not set
# model_warnings = true  # warn about weak or unknown models
#
# Per-stage settings below beat the profile; --model-profile and --provider
# on the command line beat both. A stage that sets only `model` runs on the
# provider mkcv finds that model under.
#
# [default.pipeline.stages.analyze]
# provider = "anthropic"
# model = "claude-haiku-5-5"
# temperature = 0.2
#
# [default.pipeline.stages.select]
# provider = "anthropic"
# model = "claude-opus-5-5"
# temperature = 0.3
#
# [default.pipeline.stages.tailor]
# provider = "anthropic"
# model = "claude-opus-5-5"
# temperature = 0.5
#
# [default.pipeline.stages.structure]
# provider = "anthropic"
# model = "claude-sonnet-5-5"
# temperature = 0.1
#
# [default.pipeline.stages.review]
# provider = "anthropic"
# model = "claude-opus-5-5"
# temperature = 0.3

# ── Cover Letter ──────────────────────────────────────────────────
# Settings for cover letter generation (used with --cover-letter).
#
# [default.cover_letter]
# auto_render = true
#
# [default.cover_letter.stages.generate]
# provider = "anthropic"
# model = "claude-opus-5-5"
# temperature = 0.6
#
# [default.cover_letter.stages.review]
# provider = "anthropic"
# model = "claude-haiku-5-5"
# temperature = 0.2
#
# Cover letter page layout
# [default.cover_letter.design]
# page_size = "us-letter"
# margin_top = "1.2in"
# margin_bottom = "1in"
# margin_left = "1in"
# margin_right = "1in"
# font = "Source Sans Pro"
# font_size = "11pt"
# name_size = "16pt"
# line_spacing = "0.7em"
# default_salutation = "Dear Hiring Manager,"

# ── Voice ─────────────────────────────────────────────────────────
# Writing-style guidelines applied during content generation.
# For detailed control, edit knowledge-base/voice.md instead.
#
# [default.voice]
# guidelines = ""

# ── Providers ─────────────────────────────────────────────────────
# WARNING: keys here are read only for this workspace; if this directory is
# a git repo, keep keys in ~/.config/mkcv/settings.toml instead or make sure
# mkcv.toml is not committed.
# Use the same table names in the user file. A key in config wins over the
# provider's environment variable, named in the comment above each section.
#
# Anthropic. Or set ANTHROPIC_API_KEY.
# [default.providers.anthropic]
# api_key = ""
#
# OpenAI. Or set OPENAI_API_KEY.
# [default.providers.openai]
# api_key = ""
#
# Google Gemini. Or set GEMINI_API_KEY or GOOGLE_API_KEY.
# [default.providers.google]
# api_key = ""
# No API key? Call Gemini on Vertex AI with Application Default
# Credentials instead (run: gcloud auth application-default login).
# Vertex mode wins over an API key.
# vertexai = true
# Google Cloud project (default: the one ADC or gcloud reports).
# project = "my-gcp-project"
# Vertex AI location.
# location = "global"
# Pin one ADC file, for example one per Google account.
# credentials_file = "~/.config/gcloud-mkcv/application_default_credentials.json"
#
# OpenRouter (one key for Claude, GPT, Gemini and more). Or set OPENROUTER_API_KEY.
# [default.providers.openrouter]
# api_key = ""
#
# Ollama runs locally and needs no key. Set base_url only if it listens
# somewhere else.
# [default.providers.ollama]
# base_url = "http://localhost:11434/v1"
#
# Any OpenAI-compatible endpoint (Groq, Together, vLLM, LM Studio, ...) is
# a provider too. Name it, then use it in a stage or with --provider.
# [default.providers.groq]
# type = "openai-compatible"
# base_url = "https://api.groq.com/openai/v1"
# api_key_env = "GROQ_API_KEY"

# ── Model catalog ─────────────────────────────────────────────────
# Tell mkcv about a model it does not know: its quality tier, prices (USD
# per 1M tokens), and how it returns structured output. Unknown models still
# run, with conservative defaults and a warning.
#
# [[default.model_catalog]]
# provider = "groq"
# match = "llama-3.3-70b-versatile"
# tier = "efficient"  # minimal, efficient, strong, frontier
# structured_output = "json_object"  # json_schema, tool, json_object, prompt
# input_price_per_mtok = 0.59
# output_price_per_mtok = 0.79
