# Default eval matrix: the models to evaluate, the judge, and the reference model.
# Mkcv providers, keys, and catalog overrides come from the normal mkcv settings.

[run]
repeats = 1
concurrency = 2
stages = ["analyze", "select", "tailor", "structure", "review"]
cases = ["*"]                       # case IDs or "*"
preset = "standard"

[judge]
provider = "anthropic"
model = "claude-opus-5-5"

[reference]
provider = "anthropic"
model = "claude-opus-5-5"

[[models]]
provider = "anthropic"
model = "claude-opus-5-5"

[[models]]
provider = "anthropic"
model = "claude-sonnet-5-5"

[[models]]
provider = "anthropic"
model = "claude-haiku-5-5"

[[models]]
provider = "openai"
model = "gpt-6-astra"

[[models]]
provider = "openai"
model = "gpt-6.1-sol"

[[models]]
provider = "openai"
model = "gpt-6.1-terra"

[[models]]
provider = "openai"
model = "gpt-6-luna"

[[models]]
