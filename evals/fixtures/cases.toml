# Eval cases: synthetic personas paired with synthetic job descriptions.
# Every person, employer, and number here is invented.
#
# forbidden_claims are terms the job description asks for that the persona's
# knowledge base lacks; a faithful resume must not claim them.

[[cases]]
id = "backend-platform-match"
persona = "personas/backend-engineer.md"
jd = "jds/backend-platform-match.md"
expected_keywords = ["Kubernetes", "Go", "PostgreSQL", "observability", "incident response", "Terraform"]
forbidden_claims = []
review_probe_defects = []

[[cases]]
id = "backend-ml-stretch"
persona = "personas/backend-engineer.md"
jd = "jds/backend-ml-stretch.md"
expected_keywords = ["Kubernetes", "Go", "PyTorch", "MLflow", "model training", "GPU scheduling"]
forbidden_claims = ["PyTorch", "model training", "MLflow"]
review_probe_defects = []

[[cases]]
id = "product-pm-match"
persona = "personas/product-switcher.md"
jd = "jds/product-pm-match.md"
expected_keywords = ["roadmap", "customer interviews", "product requirement documents", "prioritization", "stakeholder", "beta programs"]
forbidden_claims = []
review_probe_defects = []

[cases.cover_letter]
must = [
    "present Jordan as an associate product manager who came from design",
    "use the supplier onboarding work (14 customer interviews, a PRD, and a 20% rise in onboarding completion) as the main story",
]
should_connect = [
    "Jordan's supplier platform work at Wonka Industries to Umbrella Analytics' supplier experience role",
]
must_not_claim = [
    "SQL",
    "A/B testing",
    "senior product manager",
    "group product manager",
]
must_not = [
    "claim SQL, A/B testing, or analytics tools",
    "call Jordan a senior or group product manager",
