# The review stage is evaluated on one hand-written resume with seeded defects
# (reference/review-probe/resume.yaml). Its stage 1-3 references are copied
# from backend-platform-match by `bootstrap-reference`.
[[cases]]
id = "review-probe"
persona = "personas/backend-engineer.md"
jd = "jds/backend-platform-match.md"
expected_keywords = []
forbidden_claims = []
review_probe_defects = [
  "first-person pronoun in a bullet",
  "a metric (\"cut costs by 73%\") that is not in the knowledge base",
  "the JD keyword 'Terraform' is missing from the resume",
]
stages = ["review"]

# ---------------------------------------------------------------------------
# Diverse personas. Each persona usually has one strong match and one stretch.
#
# For these cases every expected keyword appears both in the job description
# and in the knowledge base, so a faithful resume can surface it. Terms the job
# description asks for and the knowledge base lacks are forbidden_claims;
# match cases list the preferred qualifications the persona does not have.
# "overreach" job descriptions bait the model with keywords the persona lacks.
# ---------------------------------------------------------------------------

# Healthcare, mid-level: ICU nurse moved into clinical informatics.
[[cases]]
id = "clinical-informatics-match"
persona = "personas/clinical-informatics-nurse.md"
jd = "jds/clinical-informatics-match.md"
expected_keywords = ["Epic", "nursing informatics", "workflow", "clinical decision support", "super-user", "go-live", "test scripts"]
forbidden_claims = ["NI-BC"]
review_probe_defects = []

# Stretch: an Epic analyst role that wants SQL, Tableau, HL7, and Python.

[cases.cover_letter]
must = [
    "explain why Renata moved from the bedside to informatics",
    "use the admission navigator redesign (52 to 34 minutes) or the 2024-05 Epic upgrade go-live as evidence",
]
should_connect = [
    "her ICU and super-user experience to the role's go-live and super-user program duties",
    "her Spanish to the preferred bilingual requirement",
]
must_not_claim = [
    "NI-BC",
]
must_not = [
    "claim Epic certification",
    "claim a completed MSN (it is in progress, expected 2027-05)",
    "say she built Epic content herself (the analyst team built it)",
    "state company facts beyond the job description (news, funding, awards, customer names)",
    "repeat resume bullets word for word",
]

[[cases]]
id = "clinical-informatics-stretch"
persona = "personas/clinical-informatics-nurse.md"
jd = "jds/clinical-informatics-stretch.md"
expected_keywords = ["Epic", "ClinDoc", "workflow", "test scripts", "go-live", "Reporting Workbench", "clinical decision support"]
