# More review probes, each a hand-written resume with six documented defects
# (reference/<probe id>/resume.yaml). Like review-probe, they copy their stage
# 1-3 references from the case that shares their persona and job description.
[[cases]]
id = "review-probe-clinical"
persona = "personas/clinical-informatics-nurse.md"
jd = "jds/clinical-informatics-match.md"
expected_keywords = []
forbidden_claims = []
review_probe_defects = [
  "a metric (\"reduced nursing documentation errors by 35%\") that is not in the knowledge base",
  "first-person pronoun in a bullet",
  "the JD requirement 'clinical decision support' is missing from the resume although the knowledge base supports it (the sepsis screening alert work)",
  "the Medical ICU role's start date (2016-06) contradicts the knowledge base (2018-06) and overlaps the Saint Brennan role",
  "a vague bullet with no concrete action or impact (\"Responsible for various informatics projects...\")",
  "the skill 'SQL' is claimed although the knowledge base does not support it",
]
stages = ["review"]

